<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🪷 Sign Up - LotusGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffd6e8 0%, #ffe9f3 50%, #d9f7e6 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 32px rgba(47, 158, 92, 0.18);
            border: 2px solid #d9f7e6;
            text-align: center;
        }
        .brand {
            font-size: 1.3em;
            font-weight: 800;
            color: #d6336c;
            margin-bottom: 6px;
        }
        .card h1 {
            font-size: 1.8em;
            color: #2f9e5c;
            margin-bottom: 4px;
            margin-top: 0;
        }
        .card p.tagline {
            color: #d6336c;
            font-weight: 600;
            font-size: 0.9em;
            margin-top: 0;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border: 2px solid #d9f7e6;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95em;
            background: #f5fdf8;
            color: #1e5631;
        }
        input:focus {
            outline: none;
            border-color: #2f9e5c;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #66bb8a, #2f9e5c);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px 12px rgba(47, 158, 92, 0.35);
            transition: transform 0.15s ease;
        }
        button:hover { transform: translateY(-2px); }
        .error {
            background: #ffe0e6;
            color: #d6336c;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .hint {
            font-size: 0.78em;
            color: #999;
            margin-top: -4px;
            margin-bottom: 6px;
        }
        .switch {
            margin-top: 18px;
            font-size: 0.9em;
            color: #666;
        }
        .switch a {
            color: #d6336c;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">🪷 LotusGuard</div>
        <h1>Join Us</h1>
        <p class="tagline">Any email works — work, school, personal!</p>
        {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email address" required>
            <input type="password" name="password" placeholder="Choose a password" required>
            <p class="hint">Must be at least 8 characters</p>
            <button type="submit">Create Account</button>
        </form>
        <p class="switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
</body>
</html>
