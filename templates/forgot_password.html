<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🪷 Reset Password - LotusGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffd6e8 0%, #ffe9f3 50%, #d9f7e6 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 32px rgba(214, 51, 108, 0.18);
            border: 2px solid #ffe0ec;
            text-align: center;
        }
        .brand { font-size: 1.3em; font-weight: 800; color: #2f9e5c; margin-bottom: 6px; }
        .card h1 { font-size: 1.6em; color: #d6336c; margin-bottom: 4px; margin-top: 0; }
        .card p.tagline { color: #2f9e5c; font-weight: 600; font-size: 0.88em; margin-top: 0; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border: 2px solid #ffd6e8;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95em;
            background: #fff8fb;
            color: #1e5631;
        }
        input:focus { outline: none; border-color: #d6336c; }
        button {
            width: 100%;
            background: linear-gradient(135deg, #f06292, #d6336c);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(214, 51, 108, 0.35);
            transition: transform 0.15s ease;
        }
        button:hover { transform: translateY(-2px); }
        .error {
            background: #ffe0e6; color: #d6336c; padding: 10px; border-radius: 10px;
            font-size: 0.85em; font-weight: 600; margin-bottom: 10px;
        }
        .success {
            background: #d9f7e6; color: #2f9e5c; padding: 10px; border-radius: 10px;
            font-size: 0.85em; font-weight: 600; margin-bottom: 10px;
        }
        .switch { margin-top: 16px; font-size: 0.9em; color: #666; }
        .switch a { color: #2f9e5c; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">🪷 LotusGuard</div>
        <h1>Reset Password</h1>

        {% if stage == "request" %}
            <p class="tagline">Enter your email — we'll send you a code 📧</p>
            {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
            <form method="POST" action="/forgot-password">
                <input type="email" name="email" placeholder="Your email address" required>
                <button type="submit">Send Code</button>
            </form>
        {% elif stage == "reset" %}
            <p class="tagline">Check your inbox for the 6-digit code ✉️</p>
            {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
            <form method="POST" action="/reset-password">
                <input type="hidden" name="email" value="{{ email }}">
                <input type="text" name="code" placeholder="6-digit code" required maxlength="6">
                <input type="password" name="new_password" placeholder="New password" required>
                <button type="submit">Reset Password</button>
            </form>
        {% endif %}

        <p class="switch">Remembered it? <a href="/login">Back to login</a></p>
    </div>
</body>
</html>
